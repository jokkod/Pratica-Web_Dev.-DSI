<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Cadastro</title>
    <link rel="icon" href="../assets/automation.png">
    <link rel="stylesheet" href="../css/register.css">
    <script type="module" href="../js/register.js" defer></script>
</head>
<body>
    <div class="form">
        <h2>Criar Conta</h2>
    
        <form>
            <div>
                <label for="nome">Nome de usuário:</label>
                <input type="nome" id="nome" name="nome" autocomplete="off" required>
            </div>
    
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" autocomplete="off" required>
            </div>
    
            <div>
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" autocomplete="off" required>
            </div>
    
            <div>
                <label for="confirm_password">Confirmação de Senha:</label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="off" required>
            </div>
    
            <button type="submit" class="btn">Cadastrar</button>
        </form>
    
        <a href="../../index.html">Já possuo conta</a>
    </div>
</body>
</html>
