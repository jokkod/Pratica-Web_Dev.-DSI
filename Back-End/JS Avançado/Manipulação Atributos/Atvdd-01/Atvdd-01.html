<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Manipulação Atributos</title>
    <script src="Atvdd-01.js" defer></script>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <h1>Registro de Senha</h1>
    <span>Digite uma senha válida e confirme o registro:<br> A senha deve conter no mínimo 8 dígitos <br> e ao menos uma letra Maiúscula e Minúscula e Caracteres Especiais.</span>

    <div class="hide-unhideSenha">
        <input type="text" name="input" id="input" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W]).{8,}" required>
        <img src="src/assets/hide.png" alt="imagemHide-Unhide" class="input-icon">
    </div>

    <button id="btn-confirm">Registrar</button>
    <p id="mnsgConfirmacao"></p>
</body>

</html>
