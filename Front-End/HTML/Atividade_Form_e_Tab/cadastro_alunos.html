<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade de Formulário em HTML</title>
</head>
<body>
    <h1>Cadastro de Novo Aluno</h1>
    <br>
    <form action="#"></form>
    <label for="nome">
        <strong>
            Nome do Aluno:
        </strong>
    </label>
    <input
        type="text"
        name="nome"
        id="nome"
        placeholder="Nome Completo"
        autofocus
        required
    >
    <br><br>
    <label for="data">
        <strong>
        Data:
        </strong>
    </label>
    <input
        type="date"
        name="data_nascimento"
        id="data_nascimento"
        placeholder="Data de Nascimento"
        required
    >
    <br><br>
    <label for="email">
        <strong>
        Email:
        </strong>
    </label>
    <input
        type="email"
        name="email"
        id="email"
        placeholder="E-mail do Aluno"
        required
    >
    <br><br>
    <label for="telefone">
        <strong>
            Telefone:
        </strong>
    </label>
    <input
        type="tel"
        name="telefone"
        id="telefone"
        pattern="[0-9]{2}-[9]{1}-[0-9]{8}"
        maxlength="11"
        required
    >
    <br><br>
    <label for="curso">
        <strong>
        Curso:
        </strong>
    </label>
    <select name="curso" id="curso" required>
        <option selected disabled>Selecione</option>
        <option value="Desenvolvimento de Sistemas">Desenvolvimento de Sistemas</option>
        <option value="Automação Industrial">Automação Industrial</option>
        <option value="Logística Portuária">Logística Portuária</option>
        <option value="Eletroeletrônica">Eletroeletrônica</option>
        <option value="Internet das Coisas">Internet das Coisas</option>
        <option value="Energias Renováveis">Energias Renováveis</option>
    </select>
    <br><br>
    <span>
        <strong>
            Turno:
        </strong>
    </span>
    <label>
    <input
        type="radio"
        name="manha"
        id="manha"
        value="manha"
        checked
    >
    Manhã
    </label>
    <label>
    <input
        type="radio"
        name="tarde"
        id="tarde"
        value="tarde"
    >
    Tarde
    </label>
    <label>
    <input
        type="radio"
        name="noite"
        id="noite"
        value="noite"
    >
    Noite
    </label>
    <br><br>
    <label for="notas">
        <strong>
            Comentários:
        </strong>
    </label>
    <label for="titulo_notas"></label>
    <input
        type="text"
        name="titulo_notas"
        id="titulo_notas"
    >
    <br>
    <textarea
        name="notas"
        id="notas"
        placeholder="Notas"
    >
    </textarea>
    <br>
    <button type="submit" name="enviar" value="enviar">Enviar</button>
    <button type="reset" name="limpar" value="limpar">Limpar</button>
</body>
</html>
