<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: darkgray;
        }
        .grid-container{
            background-color: darkgray;
            display: grid;
            margin: 20px;
            grid-template-columns: repeat(2, 1fr);
            min-height: 200vh;
            grid-auto-rows: minmax(20px, 70%);
            gap: 5px;
            place-content: center;

        }

        .items{
            background-color: lightblue;
            gap: 10px;
            border: 3px solid darkgray;
        }

        .item1{
            grid-column: 1/3;
            margin-top: 120px;
        }

        .item2{
            grid-row: 2/4;
            margin-bottom: 0.7px;
        }

        .item4{
            margin-top: 10px;
            margin-bottom: 0.7px;
        }

        .item5{
            grid-column: 1/3;
            height: 28vh
        }

        .item6{
            margin-top: 5px;
        }

        .item7{
            grid-row: 6/7;
        }

        .item8{
            grid-row: 5/7;
            margin-top: 5px;
        }

        .item9{
            grid-column: 1/3;
            margin-bottom: 120px;
        }


    </style>
</head>
<body>
    <div class="grid-container">
        <div class="items item1">1</div>
        <div class="items item2">2</div>
        <div class="items item3">3</div>
        <div class="items item4">4</div>
        <div class="items item5">5</div>
        <div class="items item6">6</div>
        <div class="items item7">7</div>
        <div class="items item8">8</div>
        <div class="items item9">9</div>
    </div>
</body>
</html>
