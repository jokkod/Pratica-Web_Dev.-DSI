<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo-1</title>
    <style>
        h1 {
            position: relative;
            margin-left: 30px;
        }

        h1::before {
            content: "";
            background: cadetblue;
            width: 15px;
            height: 2px;
            border: 2px solid cadetblue;
            position: absolute;
            top: 15px;
            left: 5px;
            margin-right: 200px;
            /* Necessita fazer separação entre o h1 e o pseudo-elemento */
        }
    </style>
</head>
<body>
    <h1>Título Principal</h1>
</body>
</html>
