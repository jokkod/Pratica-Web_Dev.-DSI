<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática Formulários</title>
</head>
<body>
    <h1>Praticando Formulários</h1>
    <form action="#" enctype="multipart/form-data">
        <!--Ao usar input type="file" é obrigado adicionar atributo enctype ao form-->
        <label for="nome">Nome:</label>
        <!--Campos Digitação-->
        <input
            type="text"
            name="nome"
            id="nome"
            placeholder="Digite o seu nome:"
            autofocus
        >
        <br><br>
        <label for="sobrenome">Sobrenome:</label>
        <input
            type="text"
            name="sobrenome"
            id="sobrenome"
            placeholder="Digite o seu sobrenome:"
        >
        <br><br>
        <label for="email">E-mail:</label>
        <input 
            type="email" 
            name="email" 
            id="email"
            placeholder="Digite o seu email:"
        >
        <!--Campos Seleção-->
        <form action="#">
            <br><br>
            <span>
                <strong>
                    Qual o seu nível como programador?
                </strong>
            </span>
            <br><br>
            <label>
                <input
                    type="radio"
                    name="nível"
                    id="nível"
                    value="iniciante"
                    checked
                >
                Iniciante
            </label>
            <label>
                <input
                    type="radio"
                    name="nível"
                    id="nível"
                    value="intermediario"
                >
                Intermediário
            </label>
            <label>
                <input
                    type="radio"
                    name="nível"
                    id="nível"
                    value="avancado"
                >
                Avançado
            </label>
            <br><br>
            <label for="escolaridade">Sua escolaridade:</label>
            <select name="escolaridade" id="escolaridade">
                <option selected disabled>Selecione</option>
                <option value="Educação Básica">Educação Básica</option>
                <option value="Ensino Médio Incompleto">Ensino Médio Incompleto</option>
                <option value="Ensino Médio Completo">Ensino Médio Completo</option>
                <option value="Ensino Superior">Ensino Superior</option>
                <option value="Pós Graduação">Pós Graduação</option>
            </select>
            <br><br>
            <span>
                <strong>
                    Marque as alternativas que você domina:
                </strong>
            </span>
            <br>
            <label>
                <input
                    type="checkbox"
                    name="tec1"
                    id="tec1"
                    value="html"
                >
                Html
            </label>
            <label>
                <input
                    type="checkbox"
                    name="tec2"
                    id="tec2"
                    value="css"
                >
                CSS
            </label>
            <label>
                <input
                    type="checkbox"
                    name="tec3"
                    id="tec3"
                    value="javascript"
                >
                JavaScript
            </label>
            <label>
                <input
                    type="checkbox"
                    name="tec4"
                    id="tec4"
                    value="angular"
                >
                Angular
            </label>
            <label>
                <input
                    type="checkbox"
                    name="tec4"
                    id="tec4"
                    value="node.js"
                >
                Node.js
            </label>
            <br><br>
            <label for="nascimento">Data de Nascimento:</label>
                <input
                    type="date"
                    name="nascimento"
                    id="nascimento"
                >
            <br><br>
            <label for="doc">Carregar RG:</label>
            <!--Atributos do type:-->
            <!--accept="image/*"-->
            <!--accept="application/pdf"-->
                <input
                    type="file"
                    name="doc"
                    id="doc"
                >
            <br><br>
            <label for="mensagem">Escreva um comentário:</label>
            <br>
            <textarea
                name="mensagem"
                id="mensagem"
                placeholder="Mensagem"
            >
            </textarea>
            <br><br>
            <label for="senha">Criar senha:</label>
                <input
                    type="password"
                    name="senha"
                    id="senha"
                    placeholder="Digite sua senha:"
                >
            <br><br>
            <input type="submit" value="Cadastrar">
            <!--Também pode ser feito com tipo button:-->
            <!--<button type="submit"-->
            <button type="reset" value="Limpar">Limpar</button>
            <!-- type reset tem função de apagar dados dentro do form incluído -->
        </form>
    </form>
</body>
</html>
