<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <!-- Elementos relacionado a títulos-->
    <h1>Título Principal</h1>
    <h2>
        Subtítulo (se estiver no mesmo container do h1)
    </h2>
    <h3>Subtítulo secundário</h3>
    
    <!-- Elementos relacionados a textos normais-->
     <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Facilis accusantium omnis numquam?
     </p>
     <!--
     strong - negrito
     em - italico2
     del - taxado
     u - sublinhado
     -->
     <span>
        <em>Lorem ipsum</em>
        <br><br>
        <del>consectetur adipisicing.</del>
     </span>
     <br><br>
     <span>
        <strong><u>Lorem ipsum dolor sit,</u>
        <br><br>
        amet consectetur adipisicing.</strong>
     </span>
     <br><br>
     <!-- Link de acesso básico -->
     <button>Botão</button>
     <a href="https://www.google.com.br" target="_blank">Link de Acesso</a>
</body>
</html>
