<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Formulário</title>
    <link rel="stylesheet" href="src/style/style.css">
</head>
<body>
    <div class="layout-container">
        <main>
            <div class="container">
                <div class="main-textos">
                    <h1 class="extra-text">Crie sua conta</h1>
                    <span class="small-text">Preencha o Formulário</span>
                </div>
                <div class="main-dados">
                    <input type="text" placeholder="Nome" class="nome-input">
                    <input type="email" placeholder="E-mail" class="email-input">
                    <input type="password" placeholder="Senha" class="senha-input">
                </div>
                <button class="medium-text">Cadastrar</button>
            </div>
        </main>

        <aside>
            <div class="container">
                <div class="left-conteudo">
                    <h2 class="medium-text">Seja bem vindo!</h2>
                    <span class="medium-text">Acesse sua conta<br>agora mesmo.</span>
                </div>
                <button class="medium-text">Entrar</button>
                <div class="extra-conteudo">
                    <span class="small-text">Esqueci minha senha</span>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
