<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de erros</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <button id="btn-product" class="btn-product">Cadastrar Produto</button>

    <div class="container">
        <h2>Cadastro de Produto</h2>

        <form>
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" autofocus="off">
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" name="categoria" autocomplete="off">
            </div>

            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input type="text" id="preco" name="preco" autocomplete="off">
            </div>

            <div class="campo">
                <label for="estoque">Estoque</label>
                <input type="text" id="estoque" name="estoque" autocomplete="off">
            </div>

            <div class="campo">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" name="codigo" autocomplete="off">
            </div>

            <button type="submit">Salvar Produto</button>
        </form>
    </div>

    <div class="list-container">
        <ol id="list-product"></ol>
    </div>
</body>

</html>
