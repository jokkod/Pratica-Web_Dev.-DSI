<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo-1</title>
    <style>
        h1 {
            position: relative;
            padding-left: 30px;
        }

        h1::before {
            content: "";
            background: cadetblue;
            width: 20px;
            height: 3px;
            border: 2px solid cadetblue;
            position: absolute;
            top: 23px;
            left: 0;
        }
    </style>
</head>
<body>
    <h1>Título Principal</h1>
</body>
</html>
