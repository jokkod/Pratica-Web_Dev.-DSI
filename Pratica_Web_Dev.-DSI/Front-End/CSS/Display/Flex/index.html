<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prática Flex</title>
    <style>
        .conteiner-flexível{
            border: 3px solid black;
            width: 300px;
            height: 150px;
            margin: 0 auto;
            display: flex;
            flex-direction: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;

        }
        .filhos{
            width: 50px;
            height: 50px;
        }
        .two{
            background-color: #cd7f32;
        }
        .filho{
            background-color: silver;
        }
        .three{
            background-color: goldenrod;
        }
        
        




    </style>
</head>
<body>
    <div class="conteiner-flexível">
        <div class="filhos filho"></div>
        <div class="filhos two"></div>
        <div class="filhos three"></div>

    </div>
</body>
</html>
